<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status Report – Segurança da Informação e Infraestrutura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A2340; --navy-2:#13213A; --navy-3:#2A3554;
  --red:#FF4D4D; --red-strong:#ED174F;
  --green:#16B66A; --green-bar:#00B050; --green-soft:#D1FAE5; --green-ink:#065F46; --green-edge:#10B981;
  --blue:#2169A8; --cyan:#1EA4C7; --slate:#7E8798; --teal:#1F9E7A; --petrol:#13768F;
  --amber:#FFB700; --alert:#FF0000; --alert-soft:#FFCCCC;
  --hold:#4FB4E8; --hold-soft:#E0F2FC;
  --chip:#9A9CA8; --chip-ink:#13213A;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#DDE3EC;
  --ink:#13213A; --ink-2:#5A6477; --ink-3:#687281;
  --onnavy:#FFFFFF; --onnavy-2:#AEB5C6;
  --shadow:0 2px 6px rgba(19,33,58,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1426; --surface:#18203A; --surface-2:#1F2847; --line:#2E3A5C;
    --ink:#EEF1F7; --ink-2:#B3BBCC; --ink-3:#98A1B5;
    --chip:#4A5068; --chip-ink:#F2F4F8;
    --green-soft:#0F3B2C; --green-ink:#7BE3B5; --alert-soft:#4A1C22; --hold-soft:#123247;
    --navy:#141B33; --navy-2:#0B1124; --navy-3:#26304F;
    --shadow:0 2px 8px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1426; --surface:#18203A; --surface-2:#1F2847; --line:#2E3A5C;
  --ink:#EEF1F7; --ink-2:#B3BBCC; --ink-3:#98A1B5;
  --chip:#4A5068; --chip-ink:#F2F4F8;
  --green-soft:#0F3B2C; --green-ink:#7BE3B5; --alert-soft:#4A1C22; --hold-soft:#123247;
  --navy:#141B33; --navy-2:#0B1124; --navy-3:#26304F;
  --shadow:0 2px 8px rgba(0,0,0,.35);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5}
img{max-width:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* layout */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.nav{background:var(--navy);color:var(--onnavy);position:sticky;top:0;height:100vh;padding:28px 22px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.nav img{width:150px}
.nav h2{margin:0;font-size:13px;font-weight:600;color:var(--onnavy-2)}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--onnavy)}
.nav button:hover{background:var(--navy-3)}
.nav button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.nav .dot{width:10px;height:10px;border-radius:50%;flex:none;border:2px solid #fff}
.nav-foot{margin-top:auto;font-size:12px;color:var(--onnavy-2)}
main{padding:28px 36px 60px;min-width:0}

/* header */
.hero{background:var(--navy);color:#fff;border-radius:10px;padding:30px 34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:420px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.05);box-shadow:0 0 0 26px rgba(255,255,255,.03)}
.hero h1{margin:0;font-size:clamp(26px,3.4vw,38px);font-weight:800;line-height:1.1}
.hero h1 span{display:block;color:var(--red)}
.hero p{margin:10px 0 0;color:var(--onnavy-2);max-width:62ch}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:20px;font-size:13px}
.hero .meta b{display:block;color:#fff;font-weight:600}
.hero .meta div{color:var(--onnavy-2)}

/* summary */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.kpi{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);padding:16px 18px;border-left:5px solid var(--c)}
.kpi strong{font-size:32px;font-weight:700;line-height:1}
.kpi span{display:block;font-size:13px;color:var(--ink-2);margin-top:4px}
.panel{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.panel h3{margin:0;padding:14px 18px;font-size:16px;background:var(--navy);color:#fff}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy-2);color:#fff;font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap}
.panel table th{background:var(--surface-2);color:var(--ink);border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.sum td:first-child{font-weight:600}
.sig{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sig i{width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--c)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--bgc);color:var(--fc);white-space:nowrap}
.mini{display:flex;align-items:center;gap:8px;min-width:120px}
.mini .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.mini .bar i{display:block;height:100%;background:var(--green-bar)}
.linkbtn{all:unset;cursor:pointer;color:inherit;font-weight:600;border-bottom:1px dashed var(--ink-3)}
.linkbtn:focus-visible{outline:2px solid var(--red)}

/* project section = slide */
.proj{display:grid;grid-template-columns:280px 1fr;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-top:28px}
.side{background:var(--navy);color:#fff;padding:26px 22px;position:relative}
.side h2{margin:0;font-size:28px;font-weight:800;line-height:1.08;text-transform:uppercase}
.side h2 span{display:block;color:var(--red);font-size:.8em}
.side h2.nc{text-transform:none}
.side .hold{position:absolute;right:14px;top:30px;transform:rotate(-24deg);color:var(--hold);font-weight:800;font-size:24px;letter-spacing:.5px}
.side .desc{font-size:13px;color:#E6E9F0;margin:14px 0 0}
.prog{background:var(--navy-3);border-radius:4px;padding:10px 12px;margin:18px 0}
.prog .top{display:flex;justify-content:space-between;font-size:12.5px}
.prog .top b{color:#3BD16F;font-size:16px}
.prog .track{height:7px;background:#C9CDD6;border-radius:2px;margin:6px 0;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--green-bar)}
.prog .dates{display:flex;justify-content:space-between;font-size:11.5px;color:var(--onnavy-2)}
.people{font-size:12.5px;margin-top:16px}
.people .area{font-weight:700;margin-bottom:12px}
.people div{margin-bottom:8px;color:var(--onnavy-2)}
.people b{display:block;color:#fff;font-weight:600}
.people .partner{color:var(--red)}
.body{padding:22px 26px;min-width:0}
.statusrow{display:grid;grid-template-columns:repeat(3,1fr) minmax(190px,1.1fr);gap:8px;margin-bottom:20px}
.chip{background:var(--chip);color:var(--chip-ink);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;min-height:58px}
.chip small{display:block;font-weight:700;font-size:12px}
.chip>div{min-width:0;overflow-wrap:anywhere}
.chip span{font-weight:600;color:#fff}
:root[data-theme="dark"] .chip span{color:#F2F4F8}
.chip .d{width:22px;height:22px;border-radius:50%;border:3px solid #fff;flex:none;background:var(--c)}
.banner{display:flex;align-items:center;gap:12px;padding:10px 16px;font-weight:700;font-size:14.5px;border-left:5px solid var(--edge);background:var(--bgc);color:var(--fc)}
.banner svg{flex:none}
.ttl{margin:0;font-size:19px;font-weight:700}
.sub{margin:2px 0 18px;color:var(--ink-2)}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,230px)),1fr))}
.cards>*,.cols>*{min-width:0}
.cards-siem{grid-template-columns:1.5fr 1fr 1.1fr}
.card{border:1px solid var(--line);border-radius:4px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.card .hd{background:var(--h);color:#fff;padding:11px 16px;font-weight:700;font-size:15.5px}
.card .hd small{display:block;font-weight:500;font-size:12.5px;opacity:.92}
.card .bd{padding:14px 16px;flex:1}
.card .k{color:var(--h);font-weight:700;font-size:13px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 10px;margin:4px 0 0}
.big strong{font-size:30px;font-weight:700}
.big em{font-style:normal;font-weight:700;font-size:20px;color:var(--h)}
.muted{color:var(--ink-3);font-size:12.5px}
.cols{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--min,220px)),1fr));margin-top:22px}
.card,.box,.boxed,ul.ck li span,.tl div{overflow-wrap:anywhere}
.cols h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
ul.ck{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:var(--ink-2)}
ul.ck li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
ul.ck li svg{margin-top:3px}
.box{border:1px solid var(--line);border-radius:6px;background:var(--surface-2);padding:12px 16px;margin-top:16px;font-size:13.5px}
.box b{display:block;font-size:14px;color:var(--ink)}
.box span{color:var(--ink-2)}
.boxed{border:1px solid var(--ink);padding:10px 14px;font-size:13.5px;border-radius:0}
.boxed b{display:block}
.tl{display:flex;justify-content:space-between;position:relative;margin:26px 6px 4px;gap:8px}
.tl::before{content:"";position:absolute;left:6%;right:6%;top:13px;height:2px;background:var(--line)}
.tl div{position:relative;text-align:center;flex:1;font-size:12.5px;color:var(--ink-2)}
.tl i{display:grid;place-items:center;margin:0 auto 8px;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:700;font-size:12px;border:3px solid var(--surface)}
.tl i.n{width:40px;height:40px;font-size:14px;margin-top:-7px}
.tl b{display:block;color:var(--ink);font-weight:700;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tags span{background:var(--blue);color:#fff;font-weight:600;font-size:12.5px;padding:4px 12px;border-radius:5px}
.status-ok{background:#00FF00;color:#000;padding:0 4px;font-weight:500}
.status-wip{background:#FFFF00;color:#000;padding:0 4px;font-weight:500}
.prot th{background:var(--navy-2)}
.prot td:nth-child(1),.prot td:nth-child(3),.prot td:nth-child(4){text-align:center;white-space:nowrap}
.prot tbody tr:nth-child(odd) td{background:var(--surface-2)}
.footer{margin-top:34px;background:var(--navy);color:var(--onnavy-2);border-radius:10px;padding:24px 30px;font-size:13px;display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
.footer b{color:#fff}
.footer img{width:130px}
.toggle{all:unset;cursor:pointer;font-size:12px;color:var(--onnavy-2);border:1px solid var(--navy-3);border-radius:6px;padding:6px 10px;text-align:center}
.toggle:focus-visible{outline:2px solid var(--red)}

@media (max-width:1280px){.cards-siem{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}}
@media (max-width:1200px){
  .statusrow{grid-template-columns:repeat(3,minmax(0,1fr))}.statusrow .banner{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .proj{grid-template-columns:1fr}
  .side{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0 28px;align-items:start}
  .side h2,.side .desc,.side .prog{grid-column:1}
  .side .people{grid-column:2;grid-row:1 / span 3;margin-top:0}
  .side .hold{right:auto;left:230px;top:22px}
}
@media (max-width:640px){.side{display:block}.side .people{margin-top:16px}.side .hold{left:auto;right:14px}.tl{flex-wrap:wrap}.tl div{flex:1 1 40%}.tl::before{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:16px}
  .nav h2,.nav-foot{display:none}
  .nav ul{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto;padding:6px 8px;font-size:12.5px}
  main{padding:18px 14px 40px}
  .proj{grid-template-columns:1fr}
  .statusrow{grid-template-columns:1fr}
}
</style>
</head>

const nl=document.getElementById('navlist');
nl.innerHTML=`<li><button data-go="resumo"><span class="dot" style="background:var(--red)"></span>Resumo executivo</button></li>`+P.map(p=>`<li><button data-go="${p.id}"><span class="dot" style="background:${p.st==='ok'?'var(--green)':p.st==='bad'?'var(--alert)':'var(--hold)'}"></span>${p.nav}</button></li>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const el=document.getElementById(b.dataset.go);if(el)el.scrollIntoView({block:'start'});});
function goHash(){const h=(location.hash||'').slice(1);if(h){const el=document.getElementById(h);if(el)el.scrollIntoView({block:'start'});}}
window.addEventListener('load',goHash);window.addEventListener('hashchange',goHash);

const root=document.documentElement;
try{const t=localStorage.getItem('sr-theme');if(t)root.dataset.theme=t;}catch(e){}
document.getElementById('themeBtn').addEventListener('click',()=>{
 const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
 root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('sr-theme',root.dataset.theme);}catch(e){}
});
</script>
